<div class="form-overlay">

    <div class="form-container">

        <!-- HEADER -->

        <div class="form-header">

            <div>
                <h2>
                    {{ editando ? 'Editar producto' : 'Nuevo producto' }}
                </h2>

                <p>
                    {{
                        editando
                            ? 'Modificá los datos del producto'
                            : 'Agregá un nuevo producto al Candy Bar'
                    }}
                </p>
            </div>

            <button
                type="button"
                class="btn-cerrar"
                (click)="cerrarFormulario()"
            >
                ✕
            </button>

        </div>


        <!-- FORMULARIO -->

        <form
            class="producto-form"
            (ngSubmit)="guardarProducto()"
        >

            <!-- NOMBRE -->

            <div class="form-group">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    id="nombre"
                    type="text"
                    name="nombre"
                    [(ngModel)]="nombre"
                    placeholder="Ej: Coca Cola 500ml"
                    required
                >

            </div>


            <!-- DESCRIPCIÓN -->

            <div class="form-group">

                <label for="descripcion">
                    Descripción
                </label>

                <textarea
                    id="descripcion"
                    name="descripcion"
                    [(ngModel)]="descripcion"
                    placeholder="Descripción del producto"
                    rows="3"
                    required
                ></textarea>

            </div>


            <!-- CATEGORÍA -->

            <div class="form-group">

                <label for="categoria">
                    Categoría
                </label>

                <select
                    id="categoria"
                    name="categoria"
                    [(ngModel)]="categoria_id"
                    required
                >

                    <option [ngValue]="null">
                        Seleccioná una categoría
                    </option>

                    <option
                        *ngFor="let categoria of categorias"
                        [ngValue]="categoria.id"
                    >
                        {{ categoria.nombre }}
                    </option>

                </select>

            </div>


            <!-- PRECIO Y STOCK -->

            <div class="form-row">

                <div class="form-group">

                    <label for="precio">
                        Precio
                    </label>

                    <input
                        id="precio"
                        type="number"
                        name="precio"
                        [(ngModel)]="precio"
                        min="0"
                        placeholder="Ej: 3500"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="stock">
                        Stock
                    </label>

                    <input
                        id="stock"
                        type="number"
                        name="stock"
                        [(ngModel)]="stock"
                        min="0"
                        placeholder="Ej: 20"
                        required
                    >

                </div>

            </div>


            <!-- IMAGEN -->

            <div class="form-group">

                <label for="imagen">
                    Imagen
                </label>

                <input
                    id="imagen"
                    type="file"
                    accept="image/*"
                    (change)="seleccionarImagen($event)"
                >

                <span
                    class="archivo-seleccionado"
                    *ngIf="imagen"
                >
                    {{ imagen.name }}
                </span>

            </div>


            <!-- ACCIONES -->

            <div class="form-actions">

                <button
                    type="button"
                    class="btn-cancelar"
                    (click)="cerrarFormulario()"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn-guardar"
                >
                    {{ editando ? 'Guardar cambios' : 'Crear producto' }}
                </button>

            </div>

        </form>

    </div>

</div>
